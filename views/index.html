<!DOCTYPE html>
<html>
  <head>
    <base href="/">
    <link rel="stylesheet" href="/node_modules/jvectormap/jquery-jvectormap.css" />
    <script src="/node_modules/jquery/dist/jquery.min.js"></script>
    <script src="/node_modules/jvectormap/jquery-jvectormap.min.js"></script>
    <script src="/node_modules/jvectormap/tests/assets/jquery-jvectormap-world-mill-en.js"></script>
    <script src="/node_modules/jquery-ui-dist/jquery-ui.js"></script>
    <link rel="stylesheet" href="styles/main.css"/>
    <link rel="stylesheet" href="/node_modules/jquery-ui-dist/jquery-ui.css" />
    <link rel="stylesheet" href="/node_modules/jquery-ui-dist/jquery-ui.structure.css" />
    <link rel="stylesheet" href="/node_modules/jquery-ui-dist/jquery-ui.theme.css" />
    <script src="public/scripts/jQueryDP.js"></script>
    <script src="public/scripts/gdp-data.js"></script>
    <title>Covid19WorldMap</title>
  </head>
  <body>
    <!-- DATE PICKER -->
    <div id="div1">
      <p>Date <input type="text" id="date" placeholder="Enter date" /></p>
    </div>
    <!-- DATEPICKER - END -->

    <!-- MAP -->
    <div id="world-map-gdp" style="width: 100%; height: 800px"></div>
    <script>
      $("#world-map-gdp").vectorMap({
        map: "world_mill_en",
        series: {
          regions: [
            {
              values: gdpData,
              scale: ["#C8EEFF", "#0071A4"],
              normalizeFunction: "polynomial",
            },
          ],
        },
        backgroundColor: "",
        onRegionTipShow: function (e, el, code) {
          el.html(el.html() + " (GDP - " + gdpData[code] + ")");
        },
      });
    </script>
  </body>
</html>
