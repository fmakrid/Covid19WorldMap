<!DOCTYPE html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="/jquery-jvectormap-2.0.5.css"
      type="text/css"
      media="screen"
    />

    <script src="/jquery-3.6.0.min.js"></script>
    <script src="/jquery-jvectormap-2.0.5.min.js"></script>
    <script src="/jquery-jvectormap-world-mill.js"></script>
    <script src="/jquery-ui/jquery-ui.js"></script>
    <link rel="stylesheet" href="/main.css" />
    <link rel="stylesheet" href="/jquery-ui/jquery-ui.css" />
    <link rel="stylesheet" href="/jquery-ui/jquery-ui.structure.css" />
    <link rel="stylesheet" href="/jquery-ui/jquery-ui.theme.css" />
    <script src="/workaround.js"></script>
    <script src="/jQueryDP.js"></script>
    <script src="/gdp-data.js"></script>
    <title>Covid19WorldMap</title>
  </head>
  <body>
    <!-- DATE PICKER -->
    <div id="div1">
      <p>Date <input type="text" id="date" placeholder="Enter date" /></p>
    </div>
    <!-- DATEPICKER - END -->

    <!-- MAP -->
    <div id="world-map-gdp" style="width: 100%; height: 800px"></div>
    <script>
      $("#world-map-gdp").vectorMap({
        map: "world_mill",
        series: {
          regions: [
            {
              values: gdpData,
              scale: ["#C8EEFF", "#0071A4"],
              normalizeFunction: "polynomial",
            },
          ],
        },
        backgroundColor: "",
        onRegionTipShow: function (e, el, code) {
          el.html(el.html() + " (GDP - " + gdpData[code] + ")");
        },
      });
    </script>
  </body>
</html>
